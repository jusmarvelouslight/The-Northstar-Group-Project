<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Account — Self-Serve Dashboard | Northstar Co.</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #FBF7F0;
    color: #1a1a1a;
    line-height: 1.5;
  }
  header {
    padding: 28px 60px;
    border-bottom: 1px solid #e5ddd0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo { font-size: 22px; letter-spacing: 3px; font-weight: 700; }
  .logo span { color: #b08d57; font-weight: 400; }
  main { max-width: 900px; margin: 0 auto; padding: 60px 30px 100px; }
  .eyebrow { letter-spacing: 2px; font-size: 12px; color: #8a8a8a; text-transform: uppercase; }
  h1 { font-size: 56px; font-weight: 400; margin: 10px 0 40px; }
  .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid #e5ddd0; }
  .tab-btn {
    background: none; border: none; padding: 14px 20px; font-size: 15px;
    cursor: pointer; color: #8a8a8a; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: #1a1a1a; border-bottom: 2px solid #b08d57; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: #fff; border: 1px solid #e5ddd0; border-radius: 4px;
    padding: 30px; margin-top: 10px;
  }
  label { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: #555; }
  input, select {
    width: 100%; padding: 12px 14px; border: 1px solid #d8cfbe; border-radius: 3px;
    font-size: 15px; margin-bottom: 16px; background: #fff; font-family: inherit;
  }
  button.action {
    background: #1a1a1a; color: #fff; border: none; padding: 12px 26px;
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
  }
  button.action:hover { background: #333; }
  .result { margin-top: 24px; padding: 18px; border-radius: 4px; font-size: 15px; display: none; }
  .result.show { display: block; }
  .result.success { background: #eef6ee; border: 1px solid #b9dcb9; }
  .result.warn { background: #fdf3e6; border: 1px solid #eccd94; }
  .result.error { background: #fbeaea; border: 1px solid #eab8b8; }
  .result strong { display: block; margin-bottom: 6px; }
  footer { text-align: center; padding: 30px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>

<header>
  <div class="logo">NORTHSTAR <span>CO.</span></div>
  <div style="font-size:13px; color:#8a8a8a;">Client Self-Serve Portal</div>
</header>

<main>
  <div class="eyebrow">Northstar / Client Account</div>
  <h1>Your dashboard.</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="order">Order Status</button>
    <button class="tab-btn" data-tab="return">Return Eligibility</button>
    <button class="tab-btn" data-tab="stock">Stock Availability</button>
  </div>

  <!-- ORDER STATUS -->
  <div class="panel active" id="order">
    <div class="card">
      <label for="order-id">Order ID</label>
      <input type="text" id="order-id" placeholder="e.g. NS-1042">
      <button class="action" onclick="checkOrder()">Check Status</button>
      <div class="result" id="order-result"></div>
    </div>
  </div>

  <!-- RETURN ELIGIBILITY -->
  <div class="panel" id="return">
    <div class="card">
      <label for="return-order-id">Order ID</label>
      <input type="text" id="return-order-id" placeholder="e.g. NS-1042">
      <label for="return-window">Was it delivered within the last 30 days?</label>
      <select id="return-window">
        <option value="true">Yes, within 30 days</option>
        <option value="false">No, more than 30 days ago</option>
      </select>
      <button class="action" onclick="checkReturn()">Check Eligibility</button>
      <div class="result" id="return-result"></div>
    </div>
  </div>

  <!-- STOCK AVAILABILITY -->
  <div class="panel" id="stock">
    <div class="card">
      <label for="stock-query">Product Name or ID</label>
      <input type="text" id="stock-query" placeholder="e.g. Sovereign Shearling Trench or NSJ001">
      <button class="action" onclick="checkStock()">Check Availability</button>
      <div class="result" id="stock-result"></div>
    </div>
  </div>
</main>

<footer>Northstar Co. — Self-Serve Support Dashboard (MVP)</footer>

<script>
// ---- Tab switching ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

function showResult(id, type, title, body) {
  const el = document.getElementById(id);
  el.className = "result show " + type;
  el.innerHTML = "<strong>" + title + "</strong>" + body;
}

// ---- Live backend wiring (api/support.js) ----
const API_ENDPOINT = "/api/support";

async function callSupportAPI(payload) {
  const response = await fetch(API_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  return response.json();
}

async function checkOrder() {
  const orderId = document.getElementById('order-id').value.trim();
  if (!orderId) {
    showResult('order-result', 'error', 'Enter an Order ID', 'Please type an Order ID to check.');
    return;
  }
  try {
    const data = await callSupportAPI({ orderId });
    if (!data.success) throw new Error(data.error || "Unknown error");
    const type = data.order ? 'success' : 'error';
    showResult('order-result', type, data.order ? data.order.status : 'Not found', data.reply);
  } catch (err) {
    showResult('order-result', 'error', 'Something went wrong', "Couldn't reach support right now. Please try again shortly.");
  }
}

async function checkReturn() {
  const orderId = document.getElementById('return-order-id').value.trim();
  const within30Days = document.getElementById('return-window').value === "true";
  if (!orderId) {
    showResult('return-result', 'error', 'Enter an Order ID', 'Please type an Order ID to check.');
    return;
  }
  try {
    const data = await callSupportAPI({ within30Days });
    if (!data.success) throw new Error(data.error || "Unknown error");
    const type = data.eligible ? 'success' : 'error';
    showResult('return-result', type, data.eligible ? 'Eligible for return' : 'Not eligible', data.reply);
  } catch (err) {
    showResult('return-result', 'error', 'Something went wrong', "Couldn't reach support right now. Please try again shortly.");
  }
}

async function checkStock() {
  const productName = document.getElementById('stock-query').value.trim();
  if (!productName) {
    showResult('stock-result', 'error', 'Enter a product name', 'Please type a product name to check.');
    return;
  }
  try {
    const data = await callSupportAPI({ productName });
    if (!data.success) throw new Error(data.error || "Unknown error");
    const type = data.product ? 'success' : 'warn';
    showResult('stock-result', type, data.product ? data.product.name : 'Product list', data.reply);
  } catch (err) {
    showResult('stock-result', 'error', 'Something went wrong', "Couldn't reach support right now. Please try again shortly.");
  }
}
</script>

</body>
</html>
